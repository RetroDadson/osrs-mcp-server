services:
  app:
    # Published by CI on every push to master. To build from source instead, replace this line with:
    #   build: { context: ., dockerfile: docker/Dockerfile }
    image: ghcr.io/retrodadson/osrs-mcp:latest
    environment:
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=${PG_DB}
      - AUTH_SECRET=${AUTH_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HCAPTCHA_ENABLED=${HCAPTCHA_ENABLED:-false}
      - HCAPTCHA_SITEKEY=${HCAPTCHA_SITEKEY:-}
      - HCAPTCHA_SECRET=${HCAPTCHA_SECRET:-}
    restart: always
    depends_on:
      - postgres
    container_name: osrs-mcp-app
    ports:
      - 8080:8080 # serves the REST API, the MCP server (/mcp/*), and the built frontend - replace if using a reverse proxy
  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: osrs-mcp-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - ./pg-data:/var/lib/postgresql/data # change the left-hand side of : to the path you prefer the DB to store data in
