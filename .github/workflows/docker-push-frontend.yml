name: Push Frontend Docker Image

on:
  push:
    paths:
      - 'site/**'
    branches: [ master ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # NOTE: requires DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets to be configured before this will actually push anywhere —
        # not set up yet, deferred alongside the hosting decision (see plan's Hosting section).
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: ./site
          push: true
          tags: retrodadson/osrs-mcp-frontend:latest
